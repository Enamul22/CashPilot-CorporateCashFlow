name: Verify CashPilot
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CASHPILOT_MODE: hosted
      CASHPILOT_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q
      - run: python -m compileall -q src app.py
      - run: cashpilot pipeline --smoke --output /tmp/cashpilot-smoke
