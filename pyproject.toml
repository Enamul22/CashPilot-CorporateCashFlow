[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "cashpilot"
version = "1.0.0"
description = "Seven-day corporate cash visibility with evaluated forecasts and persistent human planning."
requires-python = ">=3.12,<3.14"
authors = [{name="Enamul Haque"}]
dependencies = ["streamlit==1.67.0", "pandas==3.1.1", "numpy==2.5.4", "scikit-learn==1.9.1", "plotly==7.1.0", "pyarrow==26.0.1", "sqlalchemy==2.1.8", "psycopg[binary]==3.3.9", "certifi>=2026.10.23", "python-dotenv>=1.2,<2"]
[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.5"]
[project.scripts]
cashpilot = "cashpilot.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires an isolated explicitly configured PostgreSQL branch"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
